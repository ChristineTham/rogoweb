<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rogoweb — Rogue 5.4.4 &amp; Rog-O-Matic in your browser</title>
    <meta
      name="description"
      content="Play Rogue 5.4.4, the classic 1980 dungeon crawler — or watch the legendary Rog-O-Matic AI play it for you. The original C code compiled to WebAssembly, running entirely in your browser with a VT100 terminal and live telemetry."
    />
    <meta
      name="keywords"
      content="Rogue, roguelike, Rog-O-Matic, rogomatic, WebAssembly, WASM, dungeon crawler, VT100 terminal, retro game, genetic algorithm, AI player, Rogue 5.4.4"
    />
    <meta name="author" content="Christine Tham" />
    <meta name="theme-color" content="#FE5000" />
    <link rel="canonical" href="https://christham.net/rogoweb/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rogoweb" />
    <meta property="og:title" content="Rogoweb — Rogue 5.4.4 &amp; Rog-O-Matic in your browser" />
    <meta
      property="og:description"
      content="Play Rogue 5.4.4 — or watch the legendary Rog-O-Matic AI play it — compiled to WebAssembly, running entirely in your browser with a VT100 terminal and live telemetry."
    />
    <meta property="og:url" content="https://christham.net/rogoweb/" />
    <meta property="og:image" content="https://christham.net/rogoweb/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rog-O-Matic exploring a Rogue dungeon level in the Rogoweb VT100 terminal, with live telemetry."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rogoweb — Rogue 5.4.4 &amp; Rog-O-Matic in your browser" />
    <meta
      name="twitter:description"
      content="Play Rogue 5.4.4 — or watch the legendary Rog-O-Matic AI play it — compiled to WebAssembly, running in your browser."
    />
    <meta name="twitter:image" content="https://christham.net/rogoweb/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Rog-O-Matic exploring a Rogue dungeon level in the Rogoweb VT100 terminal, with live telemetry."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script src="/coi-serviceworker.min.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="vt100-workspace flex flex-col h-screen w-screen overflow-hidden">
        <header
          class="vt100-top-bar bg-vt-beige border-b border-vt-beige-dark px-2 py-0.5 sm:py-0 flex flex-col sm:flex-row items-center justify-between z-50 shrink-0 h-auto sm:h-5 gap-1 sm:gap-0"
        >
          <div
            class="flex items-center justify-between sm:justify-start gap-3 shrink-0 w-full sm:w-auto h-5 sm:h-full"
          >
            <div class="flex items-center gap-1 h-full">
              <span
                class="rogoweb-title font-sans font-black text-[#FE5000] tracking-tighter text-base leading-none"
                >rogoweb</span
              >
              <div class="flex items-center gap-1 border-l border-black/10 pl-1.5 h-3">
                <img src="/assets/vt100-logo.jpg" class="h-5" alt="logo" />
              </div>
            </div>

            <!-- VT100 STATUS LIGHTS -->
            <div class="led-strip flex gap-1.5 ml-2 items-center h-full">
              <div
                id="led-l1"
                class="led green w-1.5 h-1.5 rounded-vt-pill bg-[#333] border border-black/50 transition-all duration-300 shadow-vt-sunken [&.active]:bg-vt-led-green [&.active]:shadow-vt-led-active-green"
              ></div>
              <div
                id="led-l2"
                class="led green w-1.5 h-1.5 rounded-vt-pill bg-[#333] border border-black/50 transition-all duration-300 shadow-vt-sunken [&.active]:bg-vt-led-green [&.active]:shadow-vt-led-active-green"
              ></div>
              <div
                id="led-l3"
                class="led green w-1.5 h-1.5 rounded-vt-pill bg-[#333] border border-black/50 transition-all duration-300 shadow-vt-sunken [&.active]:bg-vt-led-green [&.active]:shadow-vt-led-active-green"
              ></div>
              <div
                id="led-l4"
                class="led amber w-1.5 h-1.5 rounded-vt-pill bg-[#333] border border-black/50 transition-all duration-300 shadow-vt-sunken [&.active]:bg-vt-led-amber [&.active]:shadow-vt-led-active-amber"
              ></div>
            </div>
          </div>

          <div
            class="flex items-center justify-between sm:justify-start gap-2 shrink-0 w-full sm:w-auto h-5 sm:h-full"
          >
            <!-- USER & CONTROLS -->
            <div class="flex items-center gap-1 h-full">
              <label
                for="unix-name"
                class="led-label text-sm font-black text-[#555] uppercase leading-none"
                >USER</label
              >
              <input
                type="text"
                id="unix-name"
                value="rogue"
                class="terminal-input m-0.5 sm:m-1 w-14 sm:w-20 h-3 p-1 sm:p-2 text-xs sm:text-base rounded-sm text-black border border-black/20 bg-black/5 leading-none self-center"
              />
            </div>

            <div
              class="flex items-center gap-1 bg-black/5 px-1 h-3 rounded-sm border border-black/5 self-center"
            >
              <span
                class="led-label text-sm font-black text-[#555] uppercase whitespace-nowrap leading-none max-sm:text-[10px]"
                >MANUAL PLAY</span
              >
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="mode-toggle" class="sr-only peer" checked />
                <div
                  class="w-6 h-3 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[1px] after:start-[1px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-2.5 after:w-2.5 after:transition-all peer-checked:bg-dec-blue"
                ></div>
              </label>
              <span
                class="led-label text-sm font-black text-[#555] uppercase whitespace-nowrap leading-none max-sm:text-[10px]"
                >ROGOMATIC</span
              >
            </div>

            <div class="flex items-center gap-1 shrink-0">
              <button
                id="btn-start"
                class="btn-industrial bg-[#333] text-white font-black cursor-pointer rounded transition-all active:translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center justify-center h-3 py-0 px-2 text-sm w-auto m-0 shadow-none border border-black leading-none self-center"
                disabled
              >
                START
              </button>
              <button
                id="btn-pause"
                class="btn-industrial bg-[#333] text-white font-black cursor-pointer rounded transition-all active:translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center justify-center h-3 py-0 px-2 text-sm w-auto m-0 shadow-none border border-black leading-none self-center"
                disabled
              >
                PAUSE
              </button>
              <button
                id="btn-stop"
                class="btn-industrial bg-[#333] text-white font-black cursor-pointer rounded transition-all active:translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center justify-center h-3 py-0 px-2 text-sm w-auto m-0 shadow-none border border-black leading-none self-center"
                disabled
              >
                STOP
              </button>
            </div>
          </div>
        </header>

        <!-- MAIN AREA -->
        <main
          id="main-container"
          class="flex-1 relative overflow-hidden flex flex-col items-center justify-center bg-vt-beige p-0.5"
        >
          <div
            id="terminal-viewport"
            class="active-area relative bg-black overflow-hidden border-[#1a1a1b] border-2 box-border shadow-2xl"
            style="visibility: hidden"
          >
            <div id="terminal" class="h-full w-full"></div>
          </div>

          <!-- ADAPTIVE STATS PANEL -->
          <aside
            id="stats-panel"
            class="hidden panel-block bg-vt-beige-dark border border-black/20 rounded-vt-panel p-1 flex-1 min-w-[130px] max-w-[250px] max-h-full overflow-y-auto overflow-x-hidden shadow-vt-panel-inner"
          >
            <div class="flex flex-col gap-2.5 h-full">
              <!-- MONITOR STATS -->
              <section class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center mb-0.5 gap-2">
                  <span
                    class="panel-label text-base font-extrabold text-[#444] uppercase tracking-wider leading-none shrink-0"
                    >MONITOR</span
                  >
                  <span
                    id="bot-state"
                    class="text-sm font-black uppercase bg-[#222] text-p4-white px-1.5 py-0.5 rounded-vt-sharp leading-tight flex-1 h-8 inline-flex items-center justify-center text-center overflow-hidden break-words line-clamp-2"
                    >IDLE</span
                  >
                </div>

                <!-- HP Progress Bar -->
                <div class="flex items-center gap-1.5 w-full" title="Hit Points (HP)">
                  <span class="readout-label text-sm font-black w-5 shrink-0 text-[#555] uppercase leading-none">HP</span>
                  <div class="flex-1 h-4 bg-black/30 rounded relative overflow-hidden border border-black/10">
                    <div
                      id="stat-hp-bar"
                      class="h-full bg-red-600 rounded-sm transition-all duration-300"
                      style="width: 0%"
                    ></div>
                    <span
                      id="stat-hp"
                      class="absolute inset-0 flex items-center justify-center text-sm font-black text-white leading-none [text-shadow:1px_1px_1px_rgba(0,0,0,0.8)]"
                      >0(0)</span
                    >
                  </div>
                </div>

                <!-- STR Progress Bar -->
                <div class="flex items-center gap-1.5 w-full" title="Strength">
                  <span class="readout-label text-sm font-black w-5 shrink-0 text-[#555] uppercase leading-none">STR</span>
                  <div class="flex-1 h-4 bg-black/30 rounded relative overflow-hidden border border-black/10">
                    <div
                      id="stat-str-bar"
                      class="h-full bg-red-600 rounded-sm transition-all duration-300"
                      style="width: 0%"
                    ></div>
                    <span
                      id="stat-str"
                      class="absolute inset-0 flex items-center justify-center text-sm font-black text-white leading-none [text-shadow:1px_1px_1px_rgba(0,0,0,0.8)]"
                      >0(0)</span
                    >
                  </div>
                </div>

                <!-- Compact Stats Grid -->
                <div class="flex flex-wrap items-center gap-x-2.5 gap-y-1.5 mt-0.5 border border-black/15 bg-black/5 p-1.5 rounded shadow-vt-bevel-inset select-none leading-none text-sm justify-between">
                  <div class="flex items-center gap-1.5 whitespace-nowrap"><span class="text-[#555] font-black">Gold</span><span id="stat-gold" class="font-black text-vt-black">0</span></div>
                  <div class="flex items-center gap-1.5 whitespace-nowrap"><span class="text-[#555] font-black">Level</span><span id="stat-level" class="font-black text-vt-black">1</span></div>
                  <div class="flex items-center gap-1.5 whitespace-nowrap"><span class="text-[#555] font-black">Experience</span><span id="stat-exp" class="font-black text-vt-black">0/1</span></div>
                  <div class="flex items-center gap-1.5 whitespace-nowrap"><span class="text-[#555] font-black">Generation</span><span id="bot-gen" class="font-black text-vt-black">0</span></div>
                  <div class="flex items-center gap-1.5 whitespace-nowrap" title="Genotypes in the gene pool"><span class="text-[#555] font-black">Pool</span><span id="stat-pool" class="font-black text-vt-black">—</span></div>
                  <div class="flex items-center gap-1.5 whitespace-nowrap"><span class="text-[#555] font-black">Turns</span><span id="bot-turns" class="font-black text-vt-black">0</span></div>
                </div>

                <div class="flex flex-row gap-1 mt-1">
                  <button
                    id="btn-reset-gene"
                    class="btn-industrial bg-[#8b0000] hover:bg-[#a90000] text-white font-black cursor-pointer rounded transition-all active:translate-y-0.5 text-[10px] px-1 h-7 flex-1 shadow-none border border-black leading-none"
                  >
                    RESET GENE POOL
                  </button>
                  <button
                    id="btn-gene-stats"
                    class="btn-industrial bg-dec-blue hover:bg-blue-700 text-white font-black cursor-pointer rounded transition-all active:translate-y-0.5 text-[10px] px-1 h-7 flex-1 shadow-none border border-black leading-none"
                  >
                    GENE STATS
                  </button>
                </div>
              </section>

              <!-- OBSERVER LOG PANE -->
              <section class="border-t border-black/10 pt-1.5">
                <span
                  class="panel-label text-base font-extrabold text-[#444] uppercase tracking-wider block mb-1 leading-tight"
                  >OBSERVER LOG</span
                >
                <div
                  id="observer-log"
                  class="w-full h-32 bg-[#111] text-p4-white font-mono text-xs p-1.5 border border-black/30 rounded-vt-sharp overflow-y-auto overflow-x-hidden break-words whitespace-pre-wrap shadow-vt-sunken"
                >
                  <div class="text-[#0f0] opacity-50 italic">System ready...</div>
                </div>
              </section>

              <!-- CONFIGURATION -->
              <section class="border-t border-black/10 pt-1.5">
                <span
                  class="panel-label text-base font-extrabold text-[#444] uppercase tracking-wider block mb-1 leading-tight"
                  >Configuration</span
                >
                <div class="flex flex-col gap-1.5">
                  <div class="flex flex-col gap-0.5">
                    <label
                      for="seed-input"
                      class="readout-label text-sm text-[#555] font-black uppercase leading-none"
                      >RANDOM SEED</label
                    >
                    <input
                      type="text"
                      id="seed-input"
                      class="terminal-input w-full h-7 p-1 text-sm rounded-vt-sharp text-white border border-black/50 bg-[#222] leading-none"
                      placeholder="e.g. 12345"
                    />
                  </div>
                  <div class="flex flex-wrap items-center gap-x-3.5 gap-y-1.5 mt-1 w-full">
                    <div class="flex items-center gap-1.5">
                      <label class="relative inline-flex items-center cursor-pointer select-none">
                        <input
                          type="checkbox"
                          id="randomise-toggle"
                          class="sr-only peer"
                          checked
                        />
                        <div
                          class="w-6 h-3 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[1px] after:start-[1px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-2.5 after:w-2.5 after:transition-all peer-checked:bg-dec-blue"
                        ></div>
                      </label>
                      <label
                        for="randomise-toggle"
                        class="readout-label text-sm text-[#555] font-black uppercase leading-none cursor-pointer select-none"
                        >RANDOMISE</label
                      >
                    </div>
                    <div class="flex items-center gap-1.5">
                      <label class="relative inline-flex items-center cursor-pointer select-none">
                        <input
                          type="checkbox"
                          id="autorestart-toggle"
                          class="sr-only peer"
                        />
                        <div
                          class="w-6 h-3 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[1px] after:start-[1px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-2.5 after:w-2.5 after:transition-all peer-checked:bg-dec-blue"
                        ></div>
                      </label>
                      <label
                        for="autorestart-toggle"
                        class="readout-label text-sm text-[#555] font-black uppercase leading-none cursor-pointer select-none"
                        >AUTO RESTART</label
                      >
                    </div>
                  </div>
                </div>
              </section>

              <!-- VERSION FOOTER -->
              <div
                id="app-version"
                class="mt-auto border-t border-black/10 pt-1 text-[10px] text-[#666] font-mono leading-tight text-center"
              >
                rogoweb <span id="app-ver">v?</span> ·
                <a id="app-commit" href="#" target="_blank" rel="noopener" class="hover:underline">?</a>
              </div>
            </div>
          </aside>
        </main>
      </div>
    </div>
    <!-- GENE POOL RESET DIALOG -->
    <dialog id="modal-reset-gene" closedby="any" class="bg-vt-beige border-4 border-vt-black shadow-vt-dialog p-5 text-vt-black max-w-[320px] w-[90%] rounded-vt-sharp focus:outline-none backdrop:bg-black/70 backdrop:backdrop-blur-xs font-term" aria-labelledby="reset-dialog-title">
      <form method="dialog" id="form-reset-gene" class="flex flex-col gap-3">
        <h2 id="reset-dialog-title" class="text-lg font-black uppercase tracking-wider mb-3 pb-1 border-b-2 border-vt-black text-[#8b0000]">Gene Pool Init</h2>
        
        <div class="flex flex-col gap-0.5 mb-3">
          <label for="reset-pool-size" class="text-xs font-black uppercase text-vt-black/80">Gene Pool Size</label>
          <input
            type="number"
            id="reset-pool-size"
            value="20"
            min="2"
            max="100"
            required
            class="bg-[#222] text-[#ebf0ff] border-2 border-vt-black rounded-vt-sharp py-0.5 px-2 text-base font-medium focus:outline-none focus:ring-1 focus:ring-vt-led-amber/50 font-term shadow-vt-sunken"
          />
        </div>

        <div class="flex flex-col gap-0.5 mb-3">
          <label for="reset-seed" class="text-xs font-black uppercase text-vt-black/80">Random Seed</label>
          <input
            type="number"
            id="reset-seed"
            value="0"
            min="0"
            required
            class="bg-[#222] text-[#ebf0ff] border-2 border-vt-black rounded-vt-sharp py-0.5 px-2 text-base font-medium focus:outline-none focus:ring-1 focus:ring-vt-led-amber/50 font-term shadow-vt-sunken"
          />
          <span class="text-[9px] text-black/60 font-sans leading-tight mt-0.5">
            Use 0 for time-based seed.
          </span>
        </div>

        <div class="flex gap-2.5 mt-4">
          <button
            type="button"
            id="btn-reset-cancel"
            class="btn-industrial bg-[#555] text-white text-[11px] px-3 py-1.5 h-6 flex-1 border border-black"
          >
            Cancel
          </button>
          <button
            type="submit"
            id="btn-reset-confirm"
            class="btn-industrial bg-[#8b0000] hover:bg-[#a90000] text-white text-[11px] px-3 py-1.5 h-6 flex-1 border border-black"
          >
            Initialize
          </button>
        </div>
      </form>
    </dialog>

    <!-- GENE STATS DIALOG -->
    <dialog id="modal-gene-stats" closedby="any" class="bg-vt-beige border-4 border-vt-black shadow-vt-dialog p-5 text-vt-black max-w-[500px] w-[95%] rounded-vt-sharp focus:outline-none backdrop:bg-black/70 backdrop:backdrop-blur-xs font-term" aria-labelledby="stats-dialog-title">
      <form method="dialog" class="flex flex-col gap-3">
        <h2 id="stats-dialog-title" class="text-lg font-black uppercase tracking-wider mb-2 pb-1 border-b-2 border-vt-black text-dec-blue">Detailed Gene Stats</h2>
        
        <div id="gene-stats-content" class="text-xs flex flex-col gap-3 overflow-y-auto max-h-[350px] pr-1">
          <div class="italic text-black/60">Loading stats...</div>
        </div>

        <div class="flex gap-2.5 mt-2 justify-end">
          <button
            type="submit"
            class="btn-industrial bg-[#555] text-white text-[11px] px-4 py-1.5 h-6 border border-black"
          >
            Close
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
