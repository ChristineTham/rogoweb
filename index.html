<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>rogoweb :: VT100 Rogue</title>
</head>
<body>
  <div id="app">
    <div class="vt100-workspace flex flex-col h-screen w-screen overflow-hidden">
      
      <!-- RESPONSIVE TOP BAR (AUTHENTIC VT100 AESTHETICS - REFINED V4) -->
      <header class="vt100-top-bar bg-vt-beige border-b border-vt-beige-dark px-2 py-0 flex items-center justify-between z-50 shrink-0 h-5">
        
        <div class="flex items-center gap-3 shrink-0 h-full">
            <span class="rogoweb-title text-base leading-none">rogoweb</span>
            <img src="/assets/vt100-logo.jpg" alt="digital" class="h-3">
          <!-- VT100 STATUS LIGHTS (GROUPED WITH LOGO) -->
          <div class="led-strip flex gap-1 items-center h-full">
            <div id="led-l1" class="led green w-1 h-1"></div>
            <div id="led-l2" class="led green w-1 h-1"></div>
            <div id="led-l3" class="led green w-1 h-1"></div>
            <div id="led-l4" class="led amber w-1 h-1"></div>
          </div>
        </div>
        
        <div class="flex items-center gap-2 shrink-0 h-full">
          <!-- USER & CONTROLS -->
          <div class="flex items-center gap-1 h-full">
            <label for="unix-name" class="led-label text-base leading-none">USER</label>
            <input type="text" id="unix-name" value="rogue" class="terminal-input m-1 w-16 h-3 p-1 text-base border-black/20 bg-black/5 leading-none self-center">
          </div>
          
          <div class="flex items-center gap-1 bg-black/5 px-1 h-3.5 rounded-sm border border-black/5 self-center">
             <span class="led-label text-sm whitespace-nowrap leading-none">PLAY</span>
             <label class="relative inline-flex items-center cursor-pointer">
               <input type="checkbox" id="mode-toggle" class="sr-only peer">
               <div class="w-6 h-3 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[1px] after:start-[1px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-2.5 after:w-2.5 after:transition-all peer-checked:bg-dec-blue"></div>
             </label>
             <span class="led-label text-sm whitespace-nowrap leading-none">ROGOMATIC</span>
             <button id="btn-start" class="btn-industrial w-auto shadow-none border leading-none self-center" disabled>START</button>
          </div>

        </div>

      </header>

      <!-- MAIN TERMINAL AREA -->
      <main id="main-container" class="flex-1 relative overflow-hidden flex flex-col items-center justify-center bg-black p-0.5">

        <div id="terminal-viewport" class="active-area shadow-2xl relative">
          <div id="terminal"></div>
        </div>

        <!-- ADAPTIVE STATS PANEL (Initially Hidden) -->
        <aside id="stats-panel" class="hidden panel-block min-w-[150px] border-2 border-vt-beige-dark bg-vt-beige m-1">
           <span class="panel-label text-[9px]">SYSTEM DATA</span>
           <div id="stats-content" class="flex flex-col gap-0.5">
             <!-- To be populated by main.ts -->
           </div>
        </aside>

      </main>

    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
