<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEC VT100 :: Rogue Port</title>
</head>
<body>
  <div id="app">
    <div class="vt100-workspace">
      
      <!-- MONITOR SECTION: ALWAYS 5:3 -->
      <main id="monitor-unit" class="monitor-unit">
        
        <!-- Header Branding: ONLY VISIBLE ON TALL DISPLAYS -->
        <header class="header-branding">
          <div class="dec-logo-container whitespace-nowrap">
            <img src="/assets/dec-logo-blue.svg" alt="digital" class="dec-logo">
            <span class="vt100-badge">VT100</span>
          </div>
        </header>

        <div id="terminal-viewport" class="active-area">
          <div id="terminal"></div>
        </div>

      </main>

      <!-- HARDWARE MARGIN: For controls and status -->
      <aside class="hardware-controls">
        
        <!-- Sidebar Branding: ONLY VISIBLE ON WIDE DISPLAYS -->
        <div class="dec-logo-container sidebar-branding">
          <img src="/assets/dec-logo-blue.svg" alt="digital" class="dec-logo">
          <span class="vt100-badge">VT100</span>
        </div>

        <!-- DASHBOARD SCALING MODES -->
        
        <!-- 1. FULL DASHBOARD (Standard) -->
        <div class="dashboard-full">
          
          <section class="panel-block">
            <span class="panel-label">VAX LOGIN CONFIG</span>
            <div class="field-group">
              <label for="unix-name" class="led-label" style="display:block;margin-bottom:5px">USER ID</label>
              <input type="text" id="unix-name" value="rogue" class="terminal-input">
            </div>
            <button id="btn-start" class="btn-industrial" disabled>CONNECT</button>
          </section>

          <section class="panel-block">
            <span class="panel-label">VAX-11/780 DATA</span>
            <div class="digital-readout">
              <span class="readout-label">LEVEL</span>
              <span id="stat-level" class="readout-value">00</span>
            </div>
            <div class="digital-readout">
              <span class="readout-label">GOLD</span>
              <span id="stat-gold" class="readout-value">000</span>
            </div>
            <div class="digital-readout">
              <span class="readout-label">SCORE</span>
              <span id="stat-score" class="readout-value">000</span>
            </div>
          </section>

          <section class="panel-block">
            <span class="panel-label">TERMINAL STATUS</span>
            <div class="led-strip">
              <div class="led-group"><div id="led-wait" class="led amber"></div><span class="led-label">WAIT</span></div>
              <div class="led-group"><div id="led-online" class="led green"></div><span class="led-label">ONLINE</span></div>
              <div class="led-group"><div id="led-local" class="led amber active"></div><span class="led-label">LOCAL</span></div>
            </div>
            <div class="led-strip" style="margin-top:20px">
              <div class="led-group"><div id="led-l1" class="led green"></div><span class="led-label">L1</span></div>
              <div class="led-group"><div id="led-l2" class="led green"></div><span class="led-label">L2</span></div>
              <div class="led-group"><div id="led-l3" class="led green"></div><span class="led-label">L3</span></div>
              <div class="led-group"><div id="led-l4" class="led green"></div><span class="led-label">L4</span></div>
            </div>
          </section>
        </div>

        <!-- 2. ICON RAIL (Narrow Sidebar) -->
        <div class="dashboard-rail">
           <div class="led amber active" title="LOCAL"></div>
           <div class="led green" title="ONLINE"></div>
           <div class="led amber" title="WAIT"></div>
           <div style="margin-top:20px" class="led green" title="L1"></div>
           <div class="led green" title="L2"></div>
           <div class="led green" title="L3"></div>
           <div class="led green" title="L4"></div>
        </div>

        <!-- 3. STATUS STRIP (Short Bottom Bar) -->
        <div class="dashboard-strip">
           <div class="led-strip">
              <div class="led amber active"></div>
              <div class="led green"></div>
              <div class="led amber"></div>
           </div>
           <div class="digital-readout" style="gap:20px">
              <span class="readout-value">L:01</span>
              <span class="readout-value">G:000</span>
              <span class="readout-value">S:000</span>
           </div>
        </div>

      </aside>

    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
